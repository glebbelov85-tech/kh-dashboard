<!doctype html>
<html lang="ru">
<head>
<meta name="referrer" content="no-referrer">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- Шаблон дашборда для руководителя. Данные берутся из data.js рядом
     (его пишет кнопка "Обновить дашборд", dashboard_export.py). -->
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<title>Поля Тритикум 2026</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=PT+Serif:wght@700&display=swap">
<style>
/* Макет: телефон в первую очередь, одна колонка; на широком экране карта слева, список справа.
   Земляные нейтральные тона, один зелёный акцент, светофор отдельно от акцента, шкала зелени от бурого к зелёному. */
:root{
  --bg:#f1f3ec; --card:#ffffff; --fg:#1f2a22; --muted:#5d6b60; --line:#d6ddd0; --soft:#e8ece2;
  --accent:#2f6b3a; --accent-fg:#ffffff;
  --ok:#4f9a55; --warn:#d29a1f; --bad:#c7483c; --none:#c9cdc2;
  --ok-bg:#e3f0e3; --warn-bg:#f8efd6; --bad-bg:#f6dedb;
  --ask:#3d6fb6; --ask-bg:#dfe8f5;
  --p1:#b5442c; --p2:#8a5a12; --p3:#2c64a8; --p4:#7a3fa0; --p5:#6b7066;
  --zone:#7a1d12;
  --display:"PT Serif",Georgia,serif; --ui:"Manrope","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141918; --card:#1d2423; --fg:#e6ebe4; --muted:#9aa89d; --line:#2f3a34; --soft:#252d2b;
  --accent:#7cc487; --accent-fg:#0f2013;
  --ok:#62b36a; --warn:#e0b14a; --bad:#e2655a; --none:#3e4744;
  --ok-bg:#1f3324; --warn-bg:#3a3118; --bad-bg:#3d2320;
  --ask:#7fa8e6; --ask-bg:#1f2b3d;
  --p1:#ef8a72; --p2:#d9a85a; --p3:#7fb0ef; --p4:#c49be0; --p5:#a3a89e; --zone:#ffb3a6;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141918; --card:#1d2423; --fg:#e6ebe4; --muted:#9aa89d; --line:#2f3a34; --soft:#252d2b;
  --accent:#7cc487; --accent-fg:#0f2013;
  --ok:#62b36a; --warn:#e0b14a; --bad:#e2655a; --none:#3e4744;
  --ok-bg:#1f3324; --warn-bg:#3a3118; --bad-bg:#3d2320;
  --ask:#7fa8e6; --ask-bg:#1f2b3d;
  --p1:#ef8a72; --p2:#d9a85a; --p3:#7fb0ef; --p4:#c49be0; --p5:#a3a89e; --zone:#ffb3a6;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:15px;line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1100px;margin:0 auto;padding-block:0 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;padding-block:18px 12px;border-bottom:1px solid var(--line)}
header.top h1{font-family:var(--display);font-size:24px;margin:0;text-wrap:balance}
header.top .upd{color:var(--muted);font-size:13px}
.tag{font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:2px 6px;margin-left:auto}
h2{font-size:18px;font-weight:800;margin:0;text-wrap:balance}
h3{font-size:12px;font-weight:700;margin:0;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
p{margin:0}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:14px}
.sec{display:flex;flex-direction:column;gap:12px;margin-top:24px}
.lead{font-size:17px;max-width:62ch;margin-top:16px}
.lead b{font-weight:800}
.card{background:var(--card);border-radius:12px;padding:14px}
/* плитки */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:720px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--card);border-radius:12px;padding:12px 14px;border-top:4px solid var(--line);display:flex;flex-direction:column;gap:2px;text-align:left;font:inherit;color:inherit;border-left:0;border-right:0;border-bottom:0}
.tile.ok{border-top-color:var(--ok)}.tile.warn{border-top-color:var(--warn)}.tile.bad{border-top-color:var(--bad)}.tile.zone{border-top-color:var(--zone)}.tile.ask{border-top-color:var(--ask)}
.tile b{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.tile span{font-size:13px;color:var(--muted)}
/* главная: две колонки */
.two{display:grid;grid-template-columns:1fr;gap:18px;margin-top:18px}
@media(min-width:900px){.two{grid-template-columns:3fr 2fr;align-items:start}}
.two>*{min-width:0}
/* карта */
.mapcard{background:var(--card);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.maptools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.seg{display:inline-flex;background:var(--soft);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:none;font:inherit;font-size:13px;font-weight:700;color:var(--muted);padding:6px 12px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.mapbox{position:relative;border-radius:8px;overflow:hidden;background:var(--soft);touch-action:none;aspect-ratio:4/3;max-width:100%}
@media(min-width:600px){.mapbox{aspect-ratio:16/10}}
.mapbox svg{width:100%;height:100%;display:block;cursor:grab}
.mapbox svg:active{cursor:grabbing}
.fpath{stroke:var(--card);stroke-width:.6;vector-effect:non-scaling-stroke;transition:fill .45s ease;cursor:pointer}
.fpath:hover{stroke:var(--fg);stroke-width:1.5}
.fpath.sel{stroke:var(--fg);stroke-width:2.5}
.zpath{fill:none;stroke:var(--zone);stroke-width:1.4;vector-effect:non-scaling-stroke;pointer-events:none}
.ppt{fill:#2c64a8;stroke:#fff;stroke-width:1;vector-effect:non-scaling-stroke;pointer-events:none}
.zoom{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:4px}
.zoom button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit;font-size:18px;font-weight:700;cursor:pointer;display:grid;place-items:center}
.tip{position:absolute;pointer-events:none;background:var(--fg);color:var(--bg);font-size:12px;padding:4px 8px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-130%);opacity:0;transition:opacity .12s}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.ramp{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.ramp .bar{height:10px;width:140px;border-radius:5px;background:linear-gradient(90deg,#9b6a3a,#d8b44c,#b5c94a,#6aab45,#2c7537)}
.player{display:flex;align-items:center;gap:10px}
.play{width:40px;height:40px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-fg);font-size:15px;cursor:pointer;flex:none;display:grid;place-items:center}
.player input{flex:1;min-width:0;accent-color:var(--accent)}
.player .dt{font-weight:800;font-variant-numeric:tabular-nums;min-width:96px;text-align:right}
.cloudnote{font-size:12px;color:var(--muted)}
/* список внимания */
.list{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:6px 1fr auto;gap:12px;background:var(--card);border-radius:10px;padding:12px 14px 12px 0;cursor:pointer;border:1px solid transparent;text-align:left;font:inherit;color:inherit;width:100%}
.item:hover,.item:focus-visible{border-color:var(--accent);outline:none}
.item .stripe{border-radius:0 3px 3px 0}
.item .t{font-weight:700}.item .r{font-size:13px;color:var(--muted);margin-top:2px}
.item .ha{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;white-space:nowrap}
.bad>.stripe{background:var(--bad)}.warn>.stripe{background:var(--warn)}.ok>.stripe{background:var(--ok)}.none>.stripe{background:var(--none)}
.more{border:1px dashed var(--line);background:none;color:var(--accent);font:inherit;font-weight:700;border-radius:10px;padding:10px;cursor:pointer}
.help{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.help b{color:var(--fg)}
/* навигация */
nav.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:4px;background:var(--card);border-top:1px solid var(--line);padding:6px max(12px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));z-index:5}
nav.tabs button{flex:1;max-width:190px;background:none;border:0;color:var(--muted);font:inherit;font-size:12px;font-weight:700;padding:6px 2px;border-radius:8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-selected="true"]{color:var(--accent);background:var(--bg)}
section.view{animation:rise .35s ease both}
@keyframes rise{from{opacity:.35;transform:translateY(8px)}to{opacity:1;transform:none}}
.reveal>*{animation:rise .45s ease both}
.reveal>*:nth-child(2){animation-delay:.04s}.reveal>*:nth-child(3){animation-delay:.08s}.reveal>*:nth-child(4){animation-delay:.12s}.reveal>*:nth-child(5){animation-delay:.16s}.reveal>*:nth-child(n+6){animation-delay:.2s}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* карточка поля */
.back{background:none;border:0;color:var(--accent);font:inherit;font-weight:700;cursor:pointer;padding:14px 0 4px;align-self:flex-start}
.fhead{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.fhead h2{font-family:var(--display);font-size:26px}
.badge{font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px}
.badge.bad{background:var(--bad-bg);color:var(--bad)}.badge.warn{background:var(--warn-bg);color:var(--warn)}.badge.ok{background:var(--ok-bg);color:var(--ok)}.badge.none{background:var(--soft);color:var(--muted)}.badge.ask{background:var(--ask-bg);color:var(--ask)}
.ask>.stripe{background:var(--ask)}
.caveat{border-left:4px solid var(--ask);background:var(--ask-bg);border-radius:10px;padding:12px 14px;font-size:14.5px;line-height:1.5}
.caveat b{color:var(--fg)}
.caveat a{color:var(--ask);font-weight:700}
.rlist{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.rlist li{font-size:15px;line-height:1.5}
.rlist li b{display:block}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.rgrid .card h3{margin-bottom:8px}
.rgrid ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14.5px;line-height:1.45}
.prow{display:grid;gap:4px;font-size:14px;line-height:1.45}
.prow dt{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700;margin-top:6px}
.prow dd{margin:0}
.qtab{width:100%;border-collapse:collapse;font-size:14px}
.qtab th,.qtab td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
.qtab th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.qtab td:first-child{color:var(--muted);width:28px}
.qtab .ans{color:var(--muted);font-style:italic;white-space:nowrap}
@media (max-width:640px){.qtab .dat{display:none}}
.facts{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:14px;color:var(--muted)}
.facts b{color:var(--fg);font-weight:700}
.say{font-size:16px;border-left:3px solid var(--accent);padding:2px 0 2px 12px;max-width:66ch}
.grid2{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:760px){.grid2{grid-template-columns:1fr 1fr}}
.grid2>*{min-width:0}
.chart svg{width:100%;height:auto;display:block;max-width:100%;overflow:visible}
.chart .ax{stroke:var(--line);stroke-width:1}
.chart .lbl{font-size:10px;fill:var(--muted);font-family:var(--ui)}
.chart .draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 1.2s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.key{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.key i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:5px;border-radius:2px}
.key .mk{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:4px;font-size:10px;font-weight:800;color:#fff;margin-right:5px;vertical-align:-3px}
.fmap svg{width:100%;height:auto;display:block;max-height:340px}
.zcard{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);border-radius:10px;padding:12px}
.zcard header{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.zcard .rank{font-family:var(--display);font-size:22px;color:var(--accent);min-width:1.4em}
.zcard .zt{font-weight:800}
.zcard .zm{font-size:13px;color:var(--muted)}
.chip{display:inline-block;white-space:nowrap;font-size:12px;font-weight:700;color:var(--c);border:1.5px solid var(--c);border-radius:20px;padding:1px 10px}
.zimg{width:100%;border-radius:8px;background:#fff;display:block}
.dl{display:grid;grid-template-columns:repeat(3,auto);gap:2px 22px;justify-content:start;font-size:13px}
.dl dt{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.dl dd{margin:0;font-weight:800;font-variant-numeric:tabular-nums}
.todo{font-size:14px}
.gdl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0;font-size:14px}
.gdl dt{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding-top:3px}
.gdl dd{margin:0}
@media(max-width:480px){.gdl{grid-template-columns:1fr;gap:2px}.gdl dd{margin-bottom:6px}}
.todo b{color:var(--accent)}
.jr{font-size:14px;background:var(--soft);border-radius:8px;padding:8px 10px}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:7px 13px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.journal{list-style:none;padding:0;margin:0;display:flex;flex-direction:column}
.journal li{display:grid;grid-template-columns:52px 18px 1fr auto;gap:10px;font-size:14px;padding:7px 0;border-bottom:1px solid var(--line);align-items:center}
.journal li:last-child{border-bottom:0}
.journal .who{grid-column:3 / -1;margin-top:-6px;color:var(--muted);font-size:12.5px}
.journal time{color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
.journal .ha{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.photos button{padding:0;border:0;background:none;cursor:pointer;border-radius:8px;overflow:hidden;position:relative;aspect-ratio:4/3;max-width:100%}
.photos img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
.photos button:hover img{transform:scale(1.04)}
.morep{border:1px dashed var(--line);background:var(--soft);color:var(--accent);font:inherit;font-weight:700;border-radius:8px;cursor:pointer;aspect-ratio:4/3}
.photos .pc{position:absolute;left:6px;bottom:6px;font-size:11px;background:rgba(0,0,0,.6);color:#fff;padding:1px 6px;border-radius:4px}
/* разбор */
.pats{display:flex;flex-direction:column;gap:10px}
.pat{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:start;background:var(--card);border-radius:10px;padding:12px 14px}
.pat .nm{font-weight:800}
.pat .ex{grid-column:1/-1;font-size:14px;color:var(--muted);max-width:70ch}
.pat .num{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;text-align:right;white-space:nowrap}
.pat .meter{grid-column:1/-1;height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
.pat .meter i{display:block;height:100%;width:0;transition:width 1s ease}
.zgrid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:900px){.zgrid{grid-template-columns:1fr 1fr}}
.zgrid>*{min-width:0;background:var(--card)}
.proof{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:760px){.proof{grid-template-columns:repeat(3,1fr)}}
.proof .card{display:flex;flex-direction:column;gap:8px}
.proof img{width:100%;border-radius:8px;aspect-ratio:4/3;object-fit:cover;cursor:pointer}
/* культуры */
.crops{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:760px){.crops{grid-template-columns:1fr 1fr}}
.crop{background:var(--card);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.crop .row{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.crop .nm{font-weight:800;font-size:16px}
.crop .ha{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.sbar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--soft)}
.sbar i{display:block;height:100%;transition:width .9s ease}
.crop .ft{font-size:13px;color:var(--muted)}
.crop .ft b{color:var(--fg)}
.crop details summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--accent)}
.crop details .list{margin-top:8px}
.spark svg{width:100%;height:auto;display:block}
/* фото */
.lightbox{position:fixed;inset:0;background:rgba(10,14,12,.97);z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
[hidden]{display:none!important}
.lbmain{display:flex;gap:14px;align-items:center;justify-content:center;max-width:100%}
.lbwrap{position:relative;min-width:0;max-width:calc(100vw - 32px - 314px)}
.lbz{max-width:100%;max-height:72vh;overflow:hidden;border-radius:8px;touch-action:none;cursor:zoom-in}
.lbzb{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:4px;z-index:2}
.lbzb button{width:38px;height:38px;border-radius:8px;border:0;background:rgba(15,20,17,.75);color:#fff;font:inherit;font-size:20px;font-weight:700;cursor:pointer;display:grid;place-items:center}
.lbzb button:hover{background:rgba(15,20,17,.92)}
.lbmap{flex:none;width:300px;display:flex;flex-direction:column;gap:6px}
.lbmap svg{width:300px;height:300px;display:block;border-radius:8px;background:#26302b}
.lbms{position:relative}.lbmz{position:absolute;left:6px;top:6px;display:flex;flex-direction:column;gap:4px}.lbmz button{width:32px;height:32px;border-radius:7px;border:0;background:rgba(15,20,17,.78);color:#fff;font:inherit;font-size:18px;font-weight:700;cursor:pointer;display:grid;place-items:center}.lbmz button:hover{background:rgba(15,20,17,.94)}.lbmz button:disabled{opacity:.35;cursor:default}
.lbmap .mc{color:#aab3ad;font-size:12px;line-height:1.35}
.lbmap .mc b{color:#e8ece6}
@media (max-width:820px){.lbmain{flex-direction:column;gap:8px}.lbwrap{max-width:100%}.lbmap{width:min(220px,60vw)}.lbmap svg{width:min(220px,60vw);height:min(220px,60vw)}.lbz,.lbz img{max-height:52vh}.lbzb{top:auto;bottom:8px}}
.lbz.on{cursor:grab}
.lbz img{display:block;max-width:100%;max-height:72vh;object-fit:contain;transform-origin:0 0;user-select:none;-webkit-user-drag:none}
.lightbox .hint{color:#aab3ad;font-size:12px}
.lightbox .lc{color:#e8ece6;max-width:70ch;font-size:15px;text-align:center}

<script>
// ---------- запуск: на компьютере - data.js, в интернете - data.enc по коду ----------
async function tkDecrypt(buf, code){
  const u = new Uint8Array(buf), enc = new TextEncoder();
  if (String.fromCharCode(...u.slice(0,4)) !== "TKD1") throw new Error("format");
  const salt = u.slice(4,20), iv = u.slice(20,36), it = new DataView(buf, 36, 4).getUint32(0);
  const base = await crypto.subtle.importKey("raw", enc.encode(code), "PBKDF2", false, ["deriveBits"]);
  const km = new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2", salt, iterations: it, hash:"SHA-256"}, base, 512));
  const mk = await crypto.subtle.importKey("raw", km.slice(32), {name:"HMAC", hash:"SHA-256"}, false, ["verify"]);
  if (!await crypto.subtle.verify("HMAC", mk, u.slice(u.length-32), u.slice(0, u.length-32))) throw new Error("code");
  const ak = await crypto.subtle.importKey("raw", km.slice(0,32), "AES-CTR", false, ["decrypt"]);
  const gz = await crypto.subtle.decrypt({name:"AES-CTR", counter: iv, length: 128}, ak, u.slice(40, u.length-32));
  return await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
}
async function diskList(disk, size){
  const out = {}; let off = 0, total = 1;
  while (off < total) {
    const r = await fetch(`https://cloud-api.yandex.net/v1/disk/public/resources?public_key=${encodeURIComponent(disk)}&limit=200&offset=${off}&preview_size=${size}&preview_crop=false`);
    if (!r.ok) throw new Error("disk " + r.status);
    const e = (await r.json())._embedded || {}, it = e.items || [];
    total = e.total || 0; it.forEach(x => out[String(x.name).toLowerCase()] = x); off += 200;
    if (!it.length) break;
  }
  return out;
}
async function webPhotos(){
  const disk = (window.DASH.web || {}).disk; if (!disk) return 0;
  const [a, b] = await Promise.all([diskList(disk, "1280x"), diskList(disk, "2560x").catch(() => ({}))]);
  let miss = 0;
  window.DASH.media.photos.forEach(p => { const k = String(p.fn || "").toLowerCase(), x = a[k];
    if (x && x.preview) { p.img = x.preview; p.big = (b[k] && b[k].preview) || x.preview; p.orig = x.file || ""; } else miss++; });
  return miss;
}
function BOOT(){
  const app = document.getElementById("app"), nav = document.querySelector("nav.tabs");
  if (window.DASH) return MAIN();
  if (!window.WEB) { app.innerHTML = '<p style="padding:24px 0">Нет файла data.js рядом со страницей. Нажмите в плагине "Обновить дашборд".</p>'; return; }
  nav.style.display = "none";
  { const t = document.getElementById("tag"); if (t) t.textContent = "вход по коду"; }
  let saved = ""; try { saved = localStorage.getItem("tk_code") || ""; } catch (e) {}
  app.innerHTML = `<form id="login" class="card" style="max-width:420px;margin:40px auto;display:flex;flex-direction:column;gap:12px">
    <b style="font-size:18px">Вход в дашборд</b><span class="note">Введите код, который вам передали.</span>
    <input id="code" type="password" autocomplete="current-password" placeholder="Код" style="font:inherit;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)">
    <label class="note" style="display:flex;gap:8px;align-items:center"><input id="rem" type="checkbox" checked> Запомнить на этом устройстве</label>
    <button class="btn" style="justify-content:center;padding:10px">Открыть</button><span id="msg" class="note"></span></form>`;
  const msg = document.getElementById("msg");
  const open = async code => {
    msg.textContent = "Открываю...";
    try {
      const r = await fetch("data.enc", {cache: "no-cache"}); if (!r.ok) throw new Error("file");
      window.DASH = JSON.parse(await tkDecrypt(await r.arrayBuffer(), code));
    } catch (e) {
      msg.textContent = e.message === "code" ? "Код не подошёл. Проверьте и попробуйте ещё раз." : "Не удалось открыть данные: " + e.message;
      try { localStorage.removeItem("tk_code"); } catch (_) {}
      return;
    }
    try { if (document.getElementById("rem").checked) localStorage.setItem("tk_code", code); } catch (e) {}
    msg.textContent = "Загружаю фото с Яндекс Диска...";
    let miss = 0; try { miss = await webPhotos(); } catch (e) { miss = -1; }
    nav.style.display = ""; MAIN();
    if (miss) console.warn(miss < 0 ? "Яндекс Диск не ответил, фото не загружены" : `На Диске не найдено фото: ${miss}`);
  };
  document.getElementById("login").onsubmit = ev => { ev.preventDefault(); const c = document.getElementById("code").value; if (c) open(c); };
  if (saved) { document.getElementById("code").value = saved; open(saved); }
}

<script>
function MAIN(){
const D = window.DASH.core, M = window.DASH.media;
const DATES = D.dates, F = D.fields, Z = D.zones, PAT = D.pat;
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nf = (x, d=0) => Number(x).toLocaleString("ru-RU", {minimumFractionDigits:d, maximumFractionDigits:d});
const MON = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const fmtD = s => { const [y,m,d] = s.split("-"); return `${+d} ${MON[+m-1]}`; };
const shortD = s => { const [y,m,d] = s.split("-"); return `${d}.${m}`; };
const cap = s => s ? s.charAt(0) + s.slice(1).toLowerCase() : "без культуры";
const ST = {ok:"норма", warn:"присмотреться", bad:"проблема", none:"без посева", ask:"вопрос агроному"};
const REC = window.DASH.rec || {text:{}, rows:[], lag:[], rp:[], q:[]}, RT = REC.text || {};
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
{ const b = window.DASH.built || ""; const bd = b ? fmtD(b.slice(0,10)) + " " + b.slice(0,4) : "";
  $("#upd").textContent = `Снимки спутника ${fmtD(DATES[0])} - ${fmtD(DATES[DATES.length-1])}, облёты дрона ${[...new Set(M.pts.map(p=>p.d))].sort().map(shortD).join(", ")}. Собрано ${bd}`;
  if (!window.DASH.demo) $("#tag").textContent = "только просмотр"; }

// ---------- общие расчёты ----------
const sown = F.filter(f => f.st !== "none");
const tot = k => F.filter(f => f.st === k);
const zoneHa = Z.reduce((a,z) => a + z.ha, 0);
const sownHa = sown.reduce((a,f) => a + f.ha, 0);
const GR = M.groups; const groupsByField = {}; GR.forEach((g,gi) => g.f.forEach(n => (groupsByField[n] ||= []).push(gi)));
const photosByField = {}; GR.forEach(g => g.f.forEach(n => (photosByField[n] ||= []).push(...g.p)));
const ptsByField = {}; M.pts.forEach(p => { if (p.f) (ptsByField[p.f] ||= []).push(p); });
const fieldByName = {}; F.forEach(f => fieldByName[f.n] = f);
function rampColor(v){
  if (v == null) return null;
  const st = [[.15,[155,106,58]],[.35,[216,180,76]],[.5,[181,201,74]],[.65,[106,171,69]],[.82,[44,117,55]]];
  if (v <= st[0][0]) return `rgb(${st[0][1]})`;
  for (let i=1;i<st.length;i++) if (v <= st[i][0]) {
    const [a,ca] = st[i-1], [b,cb] = st[i], t = (v-a)/(b-a);
    return `rgb(${ca.map((c,k)=>Math.round(c+(cb[k]-c)*t))})`;
  }
  return `rgb(${st[st.length-1][1]})`;
}
function countUp(el, to, dec=0){
  if (reduce) { el.textContent = nf(to, dec); return; }
  const t0 = performance.now(), dur = 900;
  const step = t => { const k = Math.min(1,(t-t0)/dur), e = 1-Math.pow(1-k,3); el.textContent = nf(to*e, dec); if (k<1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
const pathOf = rings => rings.map(r => "M" + r.map(p => p[0]+","+p[1]).join("L") + "Z").join("");
function bbox(rings){ let a=[1e9,1e9,-1e9,-1e9]; rings.forEach(r=>r.forEach(([x,y])=>{a[0]=Math.min(a[0],x);a[1]=Math.min(a[1],y);a[2]=Math.max(a[2],x);a[3]=Math.max(a[3],y);})); return a; }
const FARM = bbox(F.flatMap(f => f.g));
const proj = (lon,lat) => [(lon-D.proj.lon0)*D.proj.kx, -(lat-D.proj.lat0)*D.proj.ky];

// ---------- карта хозяйства ----------
function bestDate(){ let b=0,bn=-1; DATES.forEach((d,k)=>{ if (d.slice(5,7)!=="07") return; const n=F.filter(f=>f.s&&f.s[k]!=null).length; if(n>bn){bn=n;b=k;} }); return b; }
function qbox(xy, lo=.04, hi=.96){ const xs=xy.map(p=>p[0]).sort((a,b)=>a-b), ys=xy.map(p=>p[1]).sort((a,b)=>a-b); const q=(a,t)=>a[Math.floor(t*(a.length-1))]; return [q(xs,lo),q(ys,lo),q(xs,hi),q(ys,hi)]; }
const CENTERS = F.map(f => { const b=bbox(f.g); return [(b[0]+b[2])/2,(b[1]+b[3])/2]; });
const mapState = {mode:"state", di:bestDate(), playing:false, timer:null, vb:null};
function farmMap(host, opts={}){
  const pad = 1.5;
  const full = [FARM[0]-pad, FARM[1]-pad, FARM[2]-FARM[0]+2*pad, FARM[3]-FARM[1]+2*pad];
  host.innerHTML = `<div class="mapbox"><svg viewBox="${full.join(" ")}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Карта полей хозяйства">
    <defs><pattern id="hatch" width="1.2" height="1.2" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="1.2" height="1.2" fill="var(--none)"/><line x1="0" y1="0" x2="0" y2="1.2" stroke="var(--muted)" stroke-width=".5"/></pattern></defs>
    <g class="fields">${F.map(f => `<path class="fpath" data-i="${f.i}" d="${pathOf(f.g)}"></path>`).join("")}</g>
    <g class="zones">${Z.map(z => `<path class="zpath" d="${pathOf(z.g)}"></path>`).join("")}</g>
    <g class="pts"></g>
  </svg><div class="zoom"><button data-z="in" aria-label="Приблизить">+</button><button data-z="out" aria-label="Отдалить">&minus;</button><button data-z="all" aria-label="Всё хозяйство" title="Показать всё хозяйство" style="font-size:13px">&#x2922;</button></div><div class="tip"></div></div>`;
  const svg = $("svg", host), box = $(".mapbox", host), tip = $(".tip", host);
  let vb = full.slice();
  const fit = b => { const r = svg.getBoundingClientRect(), asp = r.width && r.height ? r.width/r.height : 1.6; let w = (b[2]-b[0])*1.08+1, h = (b[3]-b[1])*1.08+1; if (w/h < asp) w = h*asp; else h = w/asp; return [(b[0]+b[2])/2-w/2, (b[1]+b[3])/2-h/2, w, h]; };
  const start = opts.start ? fit(opts.start) : full;
  const setVB = v => { vb = v; svg.setAttribute("viewBox", v.join(" ")); };
  const toSvg = (cx, cy) => { const r = svg.getBoundingClientRect(); const s = Math.max(vb[2]/r.width, vb[3]/r.height); const ox = (r.width*s - vb[2])/2, oy = (r.height*s - vb[3])/2; return [vb[0] - ox + (cx - r.left)*s, vb[1] - oy + (cy - r.top)*s, s]; };
  const zoomAt = (k, cx, cy) => { const [x,y] = toSvg(cx,cy); const w = Math.min(full[2]*1.2, Math.max(1.5, vb[2]*k)), h = vb[3]*(w/vb[2]); setVB([x-(x-vb[0])*(w/vb[2]), y-(y-vb[1])*(h/vb[3]), w, h]); };
  const animateTo = target => { if (reduce) return setVB(target); const s = vb.slice(), t0 = performance.now(); const st = t => { const k = Math.min(1,(t-t0)/600), e = k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2; setVB(s.map((v,i)=>v+(target[i]-v)*e)); if (k<1) requestAnimationFrame(st); }; requestAnimationFrame(st); };
  host.focusField = i => { const b = bbox(F[i].g), w = Math.max(b[2]-b[0], b[3]-b[1])*2.4+2; const cx=(b[0]+b[2])/2, cy=(b[1]+b[3])/2; animateTo([cx-w/2, cy-w*.75/2, w, w*.75]); };
  host.reset = () => animateTo(start); host.all = () => animateTo(fit(FARM));
  setVB(start);
  // жесты
  const ptrs = new Map(); let moved = 0, pinch0 = null;
  svg.addEventListener("pointerdown", e => { svg.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]); moved = 0; pinch0 = null; });
  svg.addEventListener("pointermove", e => {
    if (!ptrs.has(e.pointerId)) { // подсказка
      const p = e.target.closest(".fpath"); if (p) { const f = F[+p.dataset.i]; const r = box.getBoundingClientRect(); tip.textContent = `${f.n} · ${cap(f.c)} · ${nf(f.ha)} га`; tip.style.left = (e.clientX-r.left)+"px"; tip.style.top = (e.clientY-r.top)+"px"; tip.style.opacity = 1; } else tip.style.opacity = 0;
      return;
    }
    const prev = ptrs.get(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]);
    if (ptrs.size === 1) { const [, , s] = toSvg(0,0); const dx = (e.clientX-prev[0])*s, dy = (e.clientY-prev[1])*s; moved += Math.abs(e.clientX-prev[0]) + Math.abs(e.clientY-prev[1]); setVB([vb[0]-dx, vb[1]-dy, vb[2], vb[3]]); }
    else if (ptrs.size === 2) { const [a,b] = [...ptrs.values()]; const d = Math.hypot(a[0]-b[0], a[1]-b[1]); if (pinch0) zoomAt(pinch0/d, (a[0]+b[0])/2, (a[1]+b[1])/2); pinch0 = d; moved += 10; }
  });
  const up = e => { const was = ptrs.size; ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch0 = null;
    if (was === 1 && moved < 6 && e.type === "pointerup") { const el = document.elementFromPoint(e.clientX, e.clientY); const p = el && el.closest(".fpath"); if (p && opts.onPick) opts.onPick(+p.dataset.i); } };
  svg.addEventListener("pointerup", up); svg.addEventListener("pointercancel", up);
  svg.addEventListener("pointerleave", () => tip.style.opacity = 0);
  svg.addEventListener("wheel", e => { e.preventDefault(); zoomAt(e.deltaY > 0 ? 1.18 : 1/1.18, e.clientX, e.clientY); }, {passive:false});
  host.querySelectorAll(".zoom button").forEach(b => b.onclick = () => { const r = svg.getBoundingClientRect(); if (b.dataset.z==="all") return (Math.abs(vb[2]-start[2])<.01 ? host.all() : host.reset()); zoomAt(b.dataset.z==="in" ? 1/1.6 : 1.6, r.left+r.width/2, r.top+r.height/2); });
  // клавиатура: Enter на поле
  svg.querySelectorAll(".fpath").forEach(p => { p.setAttribute("tabindex","-1"); });
  host.paint = (mode, di) => {
    svg.querySelectorAll(".fpath").forEach(p => { const f = F[+p.dataset.i];
      if (mode === "state") p.style.fill = `var(--${f.st})`;
      else if (mode === "green") { const v = f.s ? f.s[di] : null; p.style.fill = f.st==="none" && v==null ? "var(--none)" : (rampColor(v) || "url(#hatch)"); }
      else p.style.fill = `var(--none)`;
    });
    $(".zones", svg).style.display = mode === "state" ? "" : "none";
    const g = $(".pts", svg);
    if (mode === "photos") { if (!g.childElementCount) g.innerHTML = M.pts.map(p => { const [x,y] = proj(p.lon,p.lat); return `<circle class="ppt" cx="${x.toFixed(3)}" cy="${y.toFixed(3)}" r=".14"></circle>`; }).join(""); g.style.display = ""; }
    else g.style.display = "none";
  };
  return host;
}

// ---------- представления ----------
const app = $("#app");
let MAP = null;
function viewMain(){
  const bad = tot("bad"), warn = tot("warn"), ok = tot("ok");
  const haOf = a => a.reduce((s,f)=>s+f.ha,0);
  const attn = bad.slice().sort((a,b) => (b.zh - a.zh) || ((a.jul??0) - (b.jul??0)));
  app.innerHTML = `<section class="view">
    ${RT.оговорка ? `<p class="caveat" style="margin-top:16px"><b>Важно.</b> Архив данных хозяйства только начинает собираться: цифры надёжны, а причины пока версии для проверки. С каждым сезоном выводы будут точнее. <a href="#rec">Выводы и рекомендации</a></p>` : ""}
    <p class="lead">Сезон 2026 в целом прошёл ровно. Слабые участки нашлись на <b>${nf(zoneHa)} га</b>, это ${nf(zoneHa/sownHa*100,1)}% посевов. Внимания требуют <b>${bad.length} полей</b>, ещё ${warn.length} стоит осмотреть при случае.</p>
    <div class="tiles reveal" style="margin-top:16px">
      <div class="tile ok"><b data-n="${ok.length}">0</b><span>полей в норме, ${nf(haOf(ok))} га</span></div>
      <div class="tile warn"><b data-n="${warn.length}">0</b><span>присмотреться, ${nf(haOf(warn))} га</span></div>
      <div class="tile bad"><b data-n="${bad.length}">0</b><span>полей с проблемой, ${nf(haOf(bad))} га</span></div>
      <div class="tile zone"><b data-n="${Z.length}">0</b><span>слабых участков, ${nf(zoneHa)} га</span></div>
    </div>
    <div class="two">
      <div class="stack">
        <div class="mapcard">
          <div class="maptools">
            <div class="seg" role="group" aria-label="Что показать на карте">
              <button data-m="state" aria-pressed="true">Состояние</button>
              <button data-m="green" aria-pressed="false">Зелень по датам</button>
            </div>
            <div class="legend" id="lg"></div>
          </div>
          <div id="mapHost"></div>
          <div id="playerHost"></div>
        </div>
        <div class="card help"><h3>Как читать карту</h3>
          <p><b>Состояние</b> - итог сезона по каждому полю: зелёное в норме, жёлтое стоит осмотреть, красное отставало заметно. Тёмные контуры внутри полей - слабые участки.</p>
          <p><b>Зелень по датам</b> - как густо стоял посев на каждый снимок со спутника. Нажмите ▶, и сезон проиграется за полминуты: видно, как поля зеленеют в июне и желтеют к уборке. Серая штриховка - облака, в этот день поле не видно.</p>

// --- график сезона ---
const X0 = Date.parse("2026-05-01"), X1 = Date.parse("2026-10-20");
function workKind(t){ t = t.toLowerCase();
  if (t.includes("посев") && !t.includes("предпосев")) return ["С","#2f6b3a","сев"];
  if (t.includes("уборочн") || t.includes("обмолот") || t.includes("скашиван") || t.includes("кошение")) return ["У","#8a5a12","уборка"];
  if (t.includes("десикац")) return ["Д","#b5442c","десикация"];
  if (t.includes("гербицид") || t.includes("инсектицид") || t.includes("фунгицид") || t.includes("протрав")) return ["З","#7a3fa0","защита растений"];
  return ["О","#5d6b60","обработка почвы, подкормка"];
}
function seasonChart(f, opts={}){
  const W=640, H=230, L=34, R=10, T=12, B=50;
  const x = ms => L + (ms-X0)/(X1-X0)*(W-L-R), y = v => T + (1-v/.9)*(H-T-B);
  const pts = arr => arr.map((v,k) => v==null ? null : [x(Date.parse(DATES[k])), y(v)]).filter(Boolean);
  const line = (arr, color, w, dash, cls) => { const p = pts(arr); if (p.length<2) return ""; let len = 0; for (let i=1;i<p.length;i++) len += Math.hypot(p[i][0]-p[i-1][0], p[i][1]-p[i-1][1]);
    return `<polyline class="${cls||""}" style="--len:${Math.ceil(len)}" fill="none" stroke="${color}" stroke-width="${w}" ${dash?`stroke-dasharray="${dash}"`:""} stroke-linejoin="round" stroke-linecap="round" points="${p.map(q=>q.join(",")).join(" ")}"/>`; };
  const mp = pts(f.s||[]);
  const area = mp.length>1 ? `<polygon fill="var(--accent)" opacity=".1" points="${mp[0][0]},${y(0)} ${mp.map(q=>q.join(",")).join(" ")} ${mp[mp.length-1][0]},${y(0)}"/>` : "";
  const months = [5,6,7,8,9,10].map(m => Date.parse(`2026-${String(m).padStart(2,"0")}-01`));
  const mname = ["май","июнь","июль","август","сентябрь","октябрь"];
  const works = (f.w||[]).map(w => { const [d,m] = w[0].split("."); const ms = Date.parse(`2026-${m}-${d}`); return {ms, w, k: workKind(w[1])}; }).filter(o => o.ms>=X0 && o.ms<=X1);
  // раскладка значков работ без наложения
  const lanes = []; works.forEach(o => { const px = x(o.ms); let l = 0; while (lanes[l] != null && px - lanes[l] < 15) l++; lanes[l] = px; o.l = l; });
  const phDates = [...new Set((ptsByField[f.n]||[]).map(p => p.d))];
  const svg = `<svg viewBox="0 0 ${W} ${H + Math.max(0,lanes.length-1)*16}" role="img" aria-label="Зелень поля за сезон">
    ${[0,.2,.4,.6,.8].map(v=>`<line class="ax" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text class="lbl" x="${L-6}" y="${y(v)+3}" text-anchor="end">${v.toFixed(1).replace(".",",")}</text>`).join("")}
    ${months.map((ms,i)=>`<text class="lbl" x="${x(ms)+4}" y="${H-B+14}">${mname[i]}</text><line class="ax" x1="${x(ms)}" x2="${x(ms)}" y1="${H-B}" y2="${H-B+5}"/>`).join("")}
    ${phDates.map(d=>`<g><line x1="${x(Date.parse(d))}" x2="${x(Date.parse(d))}" y1="${T}" y2="${H-B}" stroke="#2c64a8" stroke-width="1" stroke-dasharray="2 3"/><text x="${x(Date.parse(d))+3}" y="${T+9}" class="lbl" style="fill:#2c64a8">дрон ${shortD(d)}</text></g>`).join("")}
    ${area}
    ${f.m ? line(f.m, "var(--warn)", 2, "5 4", "") : ""}
    ${line(f.s||[], "var(--accent)", 3, "", "draw")}
    ${mp.map(q=>`<circle cx="${q[0]}" cy="${q[1]}" r="2.2" fill="var(--accent)"/>`).join("")}
    ${works.map(o=>`<g><title>${esc(o.w[0]+" "+o.w[1]+", "+o.w[2]+" га")}</title><rect x="${x(o.ms)-7}" y="${H-B+22+o.l*16}" width="14" height="14" rx="3" fill="${o.k[1]}"/><text x="${x(o.ms)}" y="${H-B+32.5+o.l*16}" text-anchor="middle" style="font:800 9px var(--ui);fill:#fff">${o.k[0]}</text></g>`).join("")}
  </svg>`;
  const kinds = [...new Map(works.map(o=>[o.k[0],o.k])).values()];
  return `${svg}<div class="key"><span><i style="background:var(--accent)"></i>это поле</span>${f.m?`<span><i style="background:var(--warn)"></i>соседние поля той же культуры</span>`:""}${phDates.length?`<span><i style="background:#2c64a8"></i>облёт дрона</span>`:""}${kinds.map(k=>`<span><span class="mk" style="background:${k[1]}">${k[0]}</span>${k[2]}</span>`).join("")}</div>`;
}

    ${(RT.на_2027||[]).length ? `<div class="sec"><h2>Рекомендации на 2027</h2><p class="note">Главное - не новые средства, а полнота работ и быстрая проверка всходов.</p><div class="rgrid">${RT.на_2027.map(([t,xs])=>`<div class="card"><h3>${esc(t)}</h3><ul>${xs.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`).join("")}</div></div>` : ""}
    ${bd.пункты ? `<div class="sec"><h2>Больше данных - точнее рекомендации</h2><p class="lead" style="margin-top:0;font-size:16px">${esc(bd.текст)}</p><ul class="rlist">${bd.пункты.map(([t,x])=>`<li><b>${esc(t)}</b>${esc(x)}</li>`).join("")}</ul></div>` : ""}
    ${(RT.расхождения||[]).length ? `<div class="sec"><h2>Почему возможны расхождения с тем, что было на поле</h2><div class="rgrid">${RT.расхождения.map(([t,x])=>`<div class="card"><h3>${esc(t)}</h3><p class="note">${esc(x)}</p></div>`).join("")}</div></div>` : ""}
    ${(REC.q.length || (RT.вопросы||[]).length) ? `<div class="sec"><h2>Вопросы агроному</h2><p class="note">Ответы агронома уточнят выводы, базу и правила для плагина и дашборда.</p><div class="card" style="overflow-x:auto"><table class="qtab"><thead><tr><th>№</th><th>Вопрос</th><th class="dat">Что видно по данным</th><th>Ответ</th></tr></thead><tbody>${(REC.q.length ? REC.q.map(q=>[q.n,q.вопрос,q.данные,q.ответ]) : RT.вопросы.map((q,k)=>[k+1,q[0],q[1],""])).map(([n,q,d,a])=>`<tr><td>${esc(n)}</td><td>${esc(q)}</td><td class="dat note">${esc(d)}</td><td class="${a?"":"ans"}">${a?esc(a):"ждём"}</td></tr>`).join("")}</tbody></table></div></div>` : ""}
    <p class="note">Выводы составлены по снимкам Sentinel-2, журналу работ SmartAgro и фото дрона${REC.upd?`, обновлено ${esc(REC.upd)}`:""}.</p>
  </section>`;
  app.querySelectorAll(".tile b").forEach(b => countUp(b, +b.dataset.n));
  bindItems(app);
}
// ---------- маршруты ----------
function go(h){ if (location.hash.slice(1) === h) route(); else location.hash = h; }
function route(){
  stop();
  const h = location.hash.slice(1) || "main";
  const tab = h.startsWith("f-") ? null : h;
  document.querySelectorAll('nav.tabs [role="tab"]').forEach(b => b.setAttribute("aria-selected", b.dataset.tab === (tab || "main")));
  if (h.startsWith("f-")) viewField(+h.slice(2));
  else if (h === "season") viewSeason();
  else if (h === "crops") viewCrops();
  else if (h === "photos") viewPhotos();
  else if (h === "rec") viewRec();
  else viewMain();
  window.scrollTo({top:0, behavior: reduce ? "auto" : "smooth"});
}
document.querySelectorAll('nav.tabs [role="tab"]').forEach(b => b.onclick = () => go(b.dataset.tab));
addEventListener("hashchange", route);
route();
}
BOOT();
</script>
